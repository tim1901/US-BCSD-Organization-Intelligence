[project]
name = "us-bcsd-organizational-intelligence"
version = "0.1.0"
description = "US BCSD Organizational Intelligence"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "google-genai>=1.36,<2",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "beautifulsoup4>=4.13,<5",
  "pymupdf>=1.26,<2",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
